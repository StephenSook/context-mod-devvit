name: Bug report
description: Report a bug in ContextMod or its App Directory listing
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do **not** include PII or modmail screenshots.
        For security issues, see [SECURITY.md](../SECURITY.md) — do not file a public bug report.
  - type: input
    id: subreddit
    attributes:
      label: Subreddit (optional)
      description: Which subreddit was the bot installed on?
      placeholder: r/example
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen vs what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered list. The more specific, the faster a fix.
      placeholder: |
        1. Install ContextMod on r/myteam
        2. Edit wiki/contextmod with this config: ...
        3. Submit a test post titled "..."
        4. Observed: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ContextMod version
      description: From the Observatory dashboard footer or `devvit apps get cm-devvit`
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did the bug surface?
      options:
        - Observatory dashboard
        - Mod menu action
        - Rule evaluation / trigger handler
        - Wiki config publish
        - App install / upgrade
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: Paste from Devvit logs or browser console. Redact subreddit-specific identifiers.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../CODE_OF_CONDUCT.md)
          required: true

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'Security'
    labels:
      - 'security'
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: 'Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: 'Performance'
    labels:
      - 'performance'
      - 'perf'
  - title: 'Internal / Build'
    labels:
      - 'chore'
      - 'refactor'
      - 'test'
      - 'ci'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'security'
  default: patch
template: |
  ## What's changed

  $CHANGES

  ## Test coverage

  Run `npm test` to verify. CI runs type-check + lint + 454+ vitest tests + Playwright E2E + CodeQL on every PR.

  ## Migration / breaking

  See [CHANGELOG.md](./CHANGELOG.md) for the curated, hand-edited version.

  ## Contributors

  $CONTRIBUTORS

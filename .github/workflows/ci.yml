name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Y2-X76 Node matrix — Devvit runtime is on 22 (per .nvmrc), so 22 is
        # the canonical lane. 24 added as forward-looking compat check; 20 is
        # the LTS-just-prior for downstream consumers on older infra.
        node-version: ['20', '22', '24']
    name: validate (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test (coverage)
        if: matrix.node-version == '22'
        run: npx vitest run --coverage --config vitest.config.ts
        continue-on-error: true
      - name: Upload coverage artifact
        if: matrix.node-version == '22' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - name: Build
        run: npm run build

  ai-tone:
    runs-on: ubuntu-latest
    name: AI-tone scan (soft check)
    steps:
      - uses: actions/checkout@v5
      - name: Run blocklist scanner
        run: ./scripts/check-ai-tone.sh

  e2e:
    runs-on: ubuntu-latest
    name: E2E Playwright tests (chromium)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-cross-browser:
    runs-on: ubuntu-latest
    name: E2E Playwright matrix (firefox + webkit)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      PW_FULL_MATRIX: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox webkit
      - name: Run cross-browser E2E
        run: npx playwright test --project=firefox --project=webkit
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cross-browser-report
          path: playwright-report/
          retention-days: 7
